# Fast smoke/demo run. This is not the final quality run.
model_name_or_path: Qwen/Qwen3.5-0.8B
output_dir: outputs/qwen35-0.8b-valdoria-fast-demo

train_file: data/openai_chat/train.jsonl
validation_file: data/openai_chat/validation.jsonl

max_seq_length: 512
num_train_epochs: 1
max_steps: 30
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 0.00003
warmup_ratio: 0.03
weight_decay: 0.01
lr_scheduler_type: cosine
optim: adamw_bnb_8bit

logging_steps: 1
eval_steps: 15
save_steps: 15
save_total_limit: 1

assistant_only_loss: true
gradient_checkpointing: true
bf16: auto
fp16: auto
tf32: true
seed: 42
report_to: tensorboard
