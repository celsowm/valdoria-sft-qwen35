# Legacy fallback from earlier package versions.
model_name_or_path: Qwen/Qwen3-0.6B
output_dir: outputs/qwen3-0.6b-valdoria-full-sft
train_file: data/openai_chat/train.jsonl
validation_file: data/openai_chat/validation.jsonl
max_seq_length: 768
num_train_epochs: 5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.00002
warmup_ratio: 0.05
weight_decay: 0.01
lr_scheduler_type: cosine
optim: adamw_torch
