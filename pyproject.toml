[project]
name = "valdoria-sft-qwen35"
version = "3.3.1"
description = "Projeto didático de SFT full fine-tuning com dataset sintético Valdoria e Qwen3.5-0.8B."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Valdoria SFT Course Project"}]
dependencies = [
  "torch>=2.4",
  "transformers>=4.51",
  "datasets>=3.0",
  "accelerate>=1.0",
  "trl>=0.20",
  "safetensors>=0.4.5",
  "sentencepiece>=0.2.0",
  "protobuf>=4.25",
  "pyyaml>=6.0",
  "tensorboard>=2.16",
  "rich>=13.7",
  "textual>=1.0"
]

[project.optional-dependencies]
linux-12gb = ["bitsandbytes>=0.45"]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
